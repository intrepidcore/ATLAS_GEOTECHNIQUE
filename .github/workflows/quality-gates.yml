name: Quality Gates

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test-verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps
        run: npm ci
        working-directory: ui

      - name: Build UI
        run: npm run build
        working-directory: ui

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test (Tauri)
        run: cargo test
        working-directory: apps/atlas-pro/src-tauri

      - name: Verify bundle inputs
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-bundle.ps1 -RepoRoot .

      - name: Upload verify script
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-bundle-ps1
          path: scripts/verify-bundle.ps1
