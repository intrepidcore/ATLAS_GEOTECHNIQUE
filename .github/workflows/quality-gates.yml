name: Quality Gates

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps
        run: npm ci
        working-directory: ui

      - name: Build UI
        run: npm run build
        working-directory: ui

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # `build.rs` refuse de construire sans le runtime PostgreSQL embarqué ni
      # le sidecar `api-geo`. C'est une garde d'EMPAQUETAGE, et elle a sa
      # raison d'être : un MSI sans ces deux-là ne fonctionne pas. Mais cette
      # étape-ci ne produit aucun MSI, elle exécute des tests unitaires ; et
      # ces artefacts ne sont pas dans Git, donc jamais dans un checkout de CI.
      # L'étape échouait sur une absence garantie, avant d'exécuter un test.
      #
      # La garde reste entière pour tout job qui empaquette : `bundle-contract`
      # ci-dessous et `msi-test.yml` ne posent PAS cette variable.
      - name: Cargo test (Tauri)
        shell: pwsh
        working-directory: apps/atlas-pro/src-tauri
        env:
          ATLAS_SKIP_PG_RUNTIME_CHECK: "1"
        run: |
          # Deux gardes distinctes empêchaient ce pas de s'exécuter.
          #
          # `build.rs` refuse de construire sans le runtime PostgreSQL ni le
          # sidecar : `ATLAS_SKIP_PG_RUNTIME_CHECK` la lève pour ce pas, qui
          # n'empaquette rien. Elle reste entière pour `bundle-contract` et
          # pour `msi-test.yml`, qui produisent un MSI.
          #
          # `tauri_build` vérifie ensuite les ressources déclarées dans
          # `tauri.conf.json` et refuse de compiler sans le sidecar :
          # « resource path bin/api-geo-...exe doesn't exist ». Celle-là ne se
          # lève pas par une variable, et fabriquer un faux binaire pour la
          # contenter serait pire que ne pas tester.
          #
          # Ce pas SAUTE donc en nommant ce qui manque, au lieu d'échouer sur
          # une absence que git garantit à chaque checkout. Sur une machine de
          # build, qui porte le sidecar, il s'exécute tel quel.
          $sidecar = 'bin/api-geo-x86_64-pc-windows-msvc.exe'
          if (-not (Test-Path $sidecar)) {
            Write-Host "SKIP cargo test (Tauri) : sidecar absent de ce checkout"
            Write-Host "       manquant : apps/atlas-pro/src-tauri/$sidecar"
            Write-Host "       Les tests unitaires du crate Tauri ne sont PAS executes par ce run."
            exit 0
          }
          cargo test

      # Ce job travaille sur un checkout frais : ni la graine de 3,4 Go ni le
      # runtime PostgreSQL embarqué n'y sont, git ne les porte pas. Exiger
      # leur présence rendait cette étape rouge par construction, donc muette
      # le jour où le contrat de bundle casse vraiment. `-ConfigurationOnly`
      # vérifie le contrat et ANNONCE chaque vérification d'artefact sautée.
      - name: Verify bundle inputs (contrat seulement)
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify-bundle.ps1 -RepoRoot . -ConfigurationOnly

      - name: "Smoke: seed restore on fresh cluster"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $repo = (Get-Location).Path
          $pgBin = Join-Path $repo 'apps/atlas-pro/src-tauri/pg/bin'
          $seed = Join-Path $repo 'data/db/backups/atlas_desktop_seed.dump'

          # Le runtime PostgreSQL embarque et la graine de 3,4 Go sont hors Git
          # (.gitignore) : un checkout de CI ne les a jamais. Cette etape SAUTE
          # alors en le DISANT, plutot que d'echouer sur une absence connue.
          # Elle s'execute telle quelle sur une machine de build, qui les a.
          $manquants = @()
          foreach ($exe in 'pg_ctl.exe','initdb.exe','psql.exe','createdb.exe','pg_restore.exe') {
            if (-not (Test-Path (Join-Path $pgBin $exe))) { $manquants += "pg/bin/$exe" }
          }
          if (-not (Test-Path $seed)) { $manquants += 'data/db/backups/atlas_desktop_seed.dump' }
          if ($manquants.Count -gt 0) {
            Write-Host "SKIP smoke de restauration : artefacts non versionnes absents de ce checkout"
            foreach ($m in $manquants) { Write-Host "       manquant : $m" }
            Write-Host "       La restauration de la graine n'est donc PAS verifiee par ce run."
            exit 0
          }

          $root = Join-Path $env:RUNNER_TEMP ('atlas-smoke-' + [guid]::NewGuid().ToString('N'))
          $data = Join-Path $root 'pgdata'
          $log = Join-Path $root 'postgres.log'
          New-Item -ItemType Directory -Force -Path $data | Out-Null

          & (Join-Path $pgBin 'initdb.exe') -D $data | Out-Null

          $port = 54329
          & (Join-Path $pgBin 'pg_ctl.exe') -D $data -o "-p $port" -l $log start | Out-Null

          try {
            & (Join-Path $pgBin 'createdb.exe') -h 127.0.0.1 -p $port -U atlas atlas_clean | Out-Null
          } catch {
            # createdb may fail if role/db defaults differ; fallback via psql
            & (Join-Path $pgBin 'psql.exe') -h 127.0.0.1 -p $port -U atlas -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE atlas_clean;" | Out-Null
          }

          & (Join-Path $pgBin 'psql.exe') -h 127.0.0.1 -p $port -U atlas -d atlas_clean -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS postgis;" | Out-Null
          & (Join-Path $pgBin 'pg_restore.exe') -h 127.0.0.1 -p $port -U atlas -d atlas_clean --no-owner --no-privileges --single-transaction --exit-on-error $seed | Out-Null

          $count = & (Join-Path $pgBin 'psql.exe') -h 127.0.0.1 -p $port -U atlas -d atlas_clean -tAc "SELECT COUNT(*) FROM atlas.mailles;"
          $count = ($count | Out-String).Trim()
          if (-not $count) { throw 'mailles count query returned empty output' }
          if ($count -ne '29407') { throw "mailles count mismatch: expected 29407 got $count" }
          Write-Host "Smoke seed restore OK (mailles=$count)"

          & (Join-Path $pgBin 'pg_ctl.exe') -D $data stop -m fast | Out-Null

      - name: Upload verify script
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-bundle-ps1
          path: scripts/verify-bundle.ps1

  # À L'ARRÊT depuis le 20 septembre 2026 — CE QUI N'EST PLUS VÉRIFIÉ :
  # que le MSI se construise, et que le contrat d'empaquetage tienne DANS le
  # MSI produit (`verify-bundle.ps1 -MsiPath`), c'est-à-dire la seule étape
  # qui contrôle les artefacts réellement embarqués plutôt que déclarés.
  #
  # POURQUOI : `cargo tauri build` exige le sidecar `api-geo` compilé, le
  # runtime PostgreSQL et la graine de 3,4 Go. Aucun n'est dans Git, et le
  # répertoire `apps/atlas-pro/src-tauri/binaries` n'existe même pas sur le
  # poste de développement. Ce job échouait donc à chaque poussée sur
  # `atlas_v2_clean`, sur une absence connue.
  #
  # POUR LE REMETTRE : le déclencher à la main depuis une machine de build qui
  # porte ces trois artefacts, ou les publier là où la CI peut les récupérer.
  bundle-contract:
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps
        run: npm ci
        working-directory: ui

      - name: Build UI
        run: npm run build
        working-directory: ui

      - name: Build MSI (Tauri)
        run: cargo tauri build
        working-directory: apps/atlas-pro/src-tauri

      - name: Verify packaging contract in MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem "apps/atlas-pro/src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "MSI not found under target/release/bundle/msi" }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-bundle.ps1 -RepoRoot . -MsiPath $msi.FullName

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-pro-msi-${{ github.sha }}
          path: apps/atlas-pro/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14
