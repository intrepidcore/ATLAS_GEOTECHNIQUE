name: P4-P8 Release Gates

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  p4_p8_gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies for geostat scripts
        run: |
          python -m pip install --upgrade pip
          pip install numpy psycopg2-binary pykrige scikit-learn

      - name: Run automated P4->P8 gates
        run: |
          bash scripts/ci/p4_p8_release_gates.sh

