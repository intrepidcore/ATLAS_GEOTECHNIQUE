name: Release Atlas Pro Desktop
on:
  release:
    types: [created]
jobs:
  build-atlas-pro:
    uses: intrepidcore/.github/.github/workflows/shared-tauri-release.yml@main
    with:
      app_name: atlas-pro
      app_version: ${{ github.event.release.tag_name }}
      tauri_config_path: apps/atlas-pro/src-tauri
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
