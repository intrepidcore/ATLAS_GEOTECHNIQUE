name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_clean
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    strategy:
      matrix:
        svc: [api-geo, api-infer, api-opti]
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Run migrations
        if: matrix.svc == 'api-geo'
        run: |
          cd migrations
          for file in *.sql; do
            PGPASSWORD=atlas psql -h localhost -U atlas -d atlas_clean -f "$file"
          done
        env:
          DATABASE_URL: postgres://atlas:atlas@localhost:5432/atlas_clean
      
      - name: fmt
        run: |
          cd services/${{ matrix.svc }}
          cargo fmt --all -- --check
      
      - name: clippy
        run: |
          cd services/${{ matrix.svc }}
          cargo clippy -- -D warnings
      
      - name: check
        run: |
          cd services/${{ matrix.svc }}
          cargo check --all-targets
      
      - name: test
        if: matrix.svc == 'api-geo'
        run: |
          cd services/${{ matrix.svc }}
          cargo test --all-targets
        env:
          DATABASE_URL: postgres://atlas:atlas@localhost:5432/atlas_clean
      
      - name: test-integration
        if: matrix.svc == 'api-geo'
        run: |
          cd services/${{ matrix.svc }}
          cargo test --test db_manager_tests -- --ignored --test-threads=1
        env:
          DATABASE_URL: postgres://atlas:atlas@localhost:5432/atlas_clean
      
      - name: sqlx-prepare-check
        if: matrix.svc == 'api-geo'
        run: |
          cd services/${{ matrix.svc }}
          cargo sqlx prepare --check
        env:
          DATABASE_URL: postgres://atlas:atlas@localhost:5432/atlas_clean
  
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      
      - name: install
        run: |
          cd ui
          npm ci
      
      - name: lint
        run: |
          cd ui
          npm run lint || true
      
      - name: build
        run: |
          cd ui
          npm run build

      - name: bundle-size
        run: |
          cd ui
          set -e
          if ls dist/assets/main-*.js >/dev/null 2>&1; then
            MAIN_FILE=$(ls -1 dist/assets/main-*.js | head -n 1)
          else
            MAIN_FILE=$(find dist/assets -maxdepth 1 -type f -name "*.js" ! -name "workbox-*.js" ! -name "sw.js" -printf "%s %p\n" | sort -nr | head -n 1 | awk '{print $2}')
          fi

          if [ -z "${MAIN_FILE}" ]; then
            echo "❌ Impossible de trouver un chunk JS à analyser dans ui/dist/assets"
            exit 1
          fi

          MAIN_GZ=$(gzip -c "${MAIN_FILE}" | wc -c)
          echo "Chunk analysé: ${MAIN_FILE}"
          echo "Taille gzip: ${MAIN_GZ} bytes"

          MAX_BYTES=$((1024 * 1024))
          if [ "${MAIN_GZ}" -gt "${MAX_BYTES}" ]; then
            echo "❌ Chunk principal trop grand: ${MAIN_GZ} bytes (max: ${MAX_BYTES})"
            exit 1
          fi

          echo "✅ Bundle size OK: ${MAIN_GZ} bytes"
