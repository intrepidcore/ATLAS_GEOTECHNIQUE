name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_clean
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    strategy:
      matrix:
        svc: [api-geo, api-infer, api-opti]
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable

      - name: Init CI logs
        run: |
          mkdir -p ci-logs/${{ matrix.svc }}
      
      - name: Run migrations
        if: matrix.svc == 'api-geo'
        run: |
          python3 scripts/validate_migrations.py
        env:
          DATABASE_URL: postgres://atlas:atlas@localhost:5432/atlas_clean
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: atlas
          DB_NAME: atlas_clean
          PGPASSWORD: atlas
      
      - name: fmt
        run: |
          cd services/${{ matrix.svc }}
          cargo fmt --all -- --check 2>&1 | tee ../../ci-logs/${{ matrix.svc }}/fmt.log
      
      - name: clippy
        run: |
          cd services/${{ matrix.svc }}
          cargo clippy -- -D warnings 2>&1 | tee ../../ci-logs/${{ matrix.svc }}/clippy.log
      
      - name: check
        run: |
          cd services/${{ matrix.svc }}
          cargo check --all-targets 2>&1 | tee ../../ci-logs/${{ matrix.svc }}/check.log
      
      - name: test
        if: matrix.svc == 'api-geo'
        run: |
          cd services/${{ matrix.svc }}
          cargo test --all-targets -- --nocapture 2>&1 | tee ../../ci-logs/${{ matrix.svc }}/test.log
        env:
          DATABASE_URL: postgres://atlas:atlas@localhost:5432/atlas_clean
      
      - name: test-integration
        if: matrix.svc == 'api-geo'
        run: |
          cd services/${{ matrix.svc }}
          cargo test --test db_manager_tests -- --ignored --test-threads=1 --nocapture 2>&1 | tee ../../ci-logs/${{ matrix.svc }}/test-integration.log
        env:
          DATABASE_URL: postgres://atlas:atlas@localhost:5432/atlas_clean
      
      - name: verify-geotech-quality-gates
        if: matrix.svc == 'api-geo'
        run: |
          pip3 install psycopg2-binary
          python3 scripts/healthcheck_geotech_db.py
          mv geotech_healthcheck.log ci-logs/${{ matrix.svc }}/
        env:
          DATABASE_URL: postgres://atlas:atlas@localhost:5432/atlas_clean

      - name: sqlx-prepare-check
        if: matrix.svc == 'api-geo'
        run: |
          cd services/${{ matrix.svc }}
          cargo sqlx prepare --check 2>&1 | tee ../../ci-logs/${{ matrix.svc }}/sqlx-prepare-check.log
        env:
          DATABASE_URL: postgres://atlas:atlas@localhost:5432/atlas_clean

      - name: Upload Rust CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-rust-${{ matrix.svc }}
          path: ci-logs/${{ matrix.svc }}/
          retention-days: 14

  bundle-validation:
    name: Validation Bundle Desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify bundle inputs
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts\verify-bundle.ps1
  
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      
      - name: install
        run: |
          cd ui
          npm ci

      - name: unit tests (UI)
        run: |
          cd ui
          npm run test:unit

      - name: TypeScript type-check (noEmit)
        run: |
          cd ui
          # Compte les erreurs TS hors fichiers orphelins (@ts-nocheck)
          npx tsc --noEmit 2>&1 | grep "error TS" \
            | grep -v "import-bulk-store\|DbManagerModal\|DataGrid\|SchemaTree" \
            > /tmp/ts-errors.txt || true
          COUNT=$(wc -l < /tmp/ts-errors.txt)
          if [ "$COUNT" -gt 0 ]; then
            echo "❌ $COUNT erreur(s) TypeScript non résolue(s):"
            cat /tmp/ts-errors.txt
            exit 1
          fi
          echo "✅ TypeScript OK (0 erreur hors orphelins @ts-nocheck)"

      - name: thematic params TS/Rust consistency
        run: python3 scripts/ci/check_thematic_params_consistency.py

      - name: lint
        run: |
          cd ui
          if npm run | grep -qE '^[[:space:]]+lint$'; then
            npm run lint 2>&1 | tee ui-lint.log || true
          else
            echo "(skip) no npm script named 'lint'" | tee ui-lint.log
          fi

      - name: Détecter les hardcodes de configuration
        run: |
          VIOLATIONS=0
          
          # Ports hardcodés dans HTML
          if grep -rn "127\.0\.0\.1:[0-9]\{4\}" ui/src/*.html ui/public/*.html ui/index.html 2>/dev/null; then
            echo "❌ Port hardcodé trouvé dans un fichier HTML"
            VIOLATIONS=$((VIOLATIONS + 1))
          fi
          
          # window.__API_GEO__ avec valeur hardcodée
          if grep -rn 'window\.__API_GEO__\s*=\s*"http' ui/src/ ui/index.html 2>/dev/null; then
            echo "❌ window.__API_GEO__ hardcodé trouvé"
            VIOLATIONS=$((VIOLATIONS + 1))
          fi
          
          # URLs localhost hardcodées dans TypeScript (hors tests et config)
          if grep -rn '"http://127\.0\.0\.1:800[0-9]' ui/src/ \
              --include="*.ts" --include="*.tsx" \
              | grep -v "\.spec\." | grep -v "\.test\." \
              | grep -v "vite.config" 2>/dev/null; then
            echo "❌ URL localhost hardcodée dans le code TypeScript"
            VIOLATIONS=$((VIOLATIONS + 1))
          fi
          
          if [ $VIOLATIONS -gt 0 ]; then
            echo ""
            echo "Règle [CFG-01] : La configuration ne doit jamais être dans le code source."
            echo "Utiliser : import.meta.env.VITE_API_BASE ou window.__ATLAS_CONFIG__ injecté par Tauri"
            exit 1
          fi
          
          echo "✅ Aucun hardcode de configuration détecté"
      
      - name: build
        run: |
          cd ui
          npm run build 2>&1 | tee ../ui-build.log

      - name: bundle-size
        run: |
          cd ui
          exec > >(tee ../ui-bundle-size.log) 2>&1
          set -e
          if ls dist/assets/main-*.js >/dev/null 2>&1; then
            MAIN_FILE=$(ls -1 dist/assets/main-*.js | head -n 1)
          else
            MAIN_FILE=$(find dist/assets -maxdepth 1 -type f -name "*.js" ! -name "workbox-*.js" ! -name "sw.js" -printf "%s %p\n" | sort -nr | head -n 1 | awk '{print $2}')
          fi

          if [ -z "${MAIN_FILE}" ]; then
            echo "❌ Impossible de trouver un chunk JS à analyser dans ui/dist/assets"
            exit 1
          fi

          MAIN_GZ=$(gzip -c "${MAIN_FILE}" | wc -c)
          echo "Chunk analysé: ${MAIN_FILE}"
          echo "Taille gzip: ${MAIN_GZ} bytes"

          MAX_BYTES=$((1024 * 1024))
          if [ "${MAIN_GZ}" -gt "${MAX_BYTES}" ]; then
            echo "❌ Chunk principal trop grand: ${MAIN_GZ} bytes (max: ${MAX_BYTES})"
            exit 1
          fi

          echo "✅ Bundle size OK: ${MAIN_GZ} bytes"

      - name: Upload UI CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-ui
          path: |
            ui-build.log
            ui-bundle-size.log
            ui/ui-lint.log
          retention-days: 14
