name: E2E Tests

on:
  push:
    branches: [main, develop, feat/*]
  pull_request:
    branches: [main, develop]

jobs:
  playwright:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_clean
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      
      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            services/api-geo/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run database migrations
        run: |
          psql -h localhost -U atlas -d atlas_clean -f migrations/init.sql
        env:
          PGPASSWORD: atlas
      
      - name: Build and start API
        run: |
          cd services/api-geo
          cargo build --release
          RUST_LOG=info DATABASE_URL=postgres://atlas:atlas@localhost:5432/atlas_clean ./target/release/api-geo &
          sleep 5
          curl -f http://localhost:8000/healthz || exit 1
        env:
          SQLX_OFFLINE: true
      
      - name: Install UI dependencies
        run: |
          cd ui
          npm ci
      
      - name: Install Playwright browsers
        run: |
          cd ui
          npx playwright install --with-deps chromium
      
      - name: Build UI
        run: |
          cd ui
          npm run build
      
      - name: Start UI dev server
        run: |
          cd ui
          npm run dev &
          sleep 3
          curl -f http://localhost:5173/ || exit 1
      
      - name: Run Playwright tests
        run: |
          cd ui
          npm run test:e2e
        env:
          CI: true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-results
          path: ui/test-results/
          retention-days: 7
      
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7
