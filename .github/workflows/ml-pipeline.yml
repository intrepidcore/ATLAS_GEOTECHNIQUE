name: ML Pipeline L1-L4

on:
  push:
    paths:
      - 'services/api-geo/src/**'
      - 'services/api-geo/migrations/**'
      - 'ui/src/thematic/**'
      - 'ui/src/scientific-drawer.ts'
      - 'ui/src/main.ts'
      - 'scripts/ked_rk_fusion.py'
      - 'scripts/mtgp_geotechnique.py'
      - '.github/workflows/ml-pipeline.yml'
  pull_request:
    paths:
      - 'services/api-geo/src/**'
      - 'ui/src/thematic/**'
      - 'ui/src/scientific-drawer.ts'

jobs:
  # ─── 1. Garde ARCH-01 : zéro valeur RMSE hardcodée dans le TypeScript ────────
  arch-01-no-hardcoded-metrics:
    name: "ARCH-01 — Zéro RMSE hardcodé"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier qu'aucune valeur LOO-RMSE n'est hardcodée
        run: |
          VIOLATIONS=0
          # Patterns interdits : valeurs numériques précises pour des RMSE connus
          for pattern in \
            "loo_rmse.*3\.14" \
            "loo_rmse.*16\.13" \
            "loo_rmse.*1\.69" \
            "RMSE.*=.*[0-9]\.[0-9]\{2,\}" \
            "rmse.*:.*[0-9]\.[0-9]\{4,\}[^0-9]" ; do
            if grep -rn --include="*.ts" --include="*.tsx" "$pattern" ui/src/ 2>/dev/null \
               | grep -v "node_modules" | grep -v "\.spec\." | grep -v "//.*RMSE"; then
              echo "❌ ARCH-01 VIOLATION : valeur RMSE hardcodée trouvée (pattern: $pattern)"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done
          if [ $VIOLATIONS -gt 0 ]; then
            echo "Règle ARCH-01 : les métriques viennent exclusivement de /ai/models/status"
            exit 1
          fi
          echo "✅ ARCH-01 OK — aucune valeur RMSE hardcodée"

  # ─── 2. Garde ARCH-02 : pas de std::process::Command dans les handlers HTTP ──
  arch-02-no-process-spawn:
    name: "ARCH-02 — Pas de spawn process dans handlers"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier l'absence de process::Command dans les routes HTTP
        run: |
          # Autorisé dans ai_jobs.rs (worker) mais interdit dans routes HTTP
          if grep -n "std::process::Command\|process::Command::new" \
               services/api-geo/src/thematic/routes.rs \
               services/api-geo/src/main.rs 2>/dev/null; then
            echo "❌ ARCH-02 VIOLATION : process::Command dans un handler HTTP"
            echo "Règle ARCH-02 : les scripts Python passent exclusivement par ai_job_queue"
            exit 1
          fi
          echo "✅ ARCH-02 OK — pas de spawn process dans les handlers HTTP"

  # ─── 3. Garde ARCH-03 : pas de HEAD request depuis le frontend ───────────────
  arch-03-no-head-requests:
    name: "ARCH-03 — Pas de HEAD depuis le frontend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier l'absence de fetch HEAD dans le frontend
        run: |
          if grep -rn --include="*.ts" --include="*.tsx" \
               "method.*['\"]HEAD['\"]" \
               "fetch.*HEAD" \
               ui/src/ 2>/dev/null | grep -v "node_modules" | grep -v "\.spec\."; then
            echo "❌ ARCH-03 VIOLATION : requête HEAD depuis le frontend"
            echo "Règle ARCH-03 : vérifier l'existence d'un asset via GET /ai/3d/asset (backend)"
            exit 1
          fi
          echo "✅ ARCH-03 OK — pas de requêtes HEAD dans le frontend"

  # ─── 4. Rust cargo check + SQLX offline ──────────────────────────────────────
  rust-check:
    name: "Rust — cargo check api-geo"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/api-geo

      - name: cargo check
        working-directory: services/api-geo
        env:
          SQLX_OFFLINE: "true"
        run: cargo check 2>&1

      - name: cargo clippy
        working-directory: services/api-geo
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy -- -D warnings 2>&1

  # ─── 5. TypeScript — vérification des nouveaux fichiers thematic ─────────────
  typescript-thematic:
    name: "TypeScript — thematic + scientific-drawer"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: TypeScript strict check (thematic + scientific-drawer)
        working-directory: ui
        run: |
          npx tsc --noEmit 2>&1 | grep -E "thematic|scientific-drawer|main\.ts" || true
          # Fail si erreur sur les fichiers critiques du pipeline ML
          ERRORS=$(npx tsc --noEmit 2>&1 | grep -E "thematic|scientific-drawer" | grep "error TS" | wc -l)
          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ $ERRORS erreur(s) TypeScript dans les fichiers ML pipeline"
            npx tsc --noEmit 2>&1 | grep -E "thematic|scientific-drawer" | grep "error TS"
            exit 1
          fi
          echo "✅ TypeScript OK sur les fichiers ML pipeline"

  # ─── 6. Test endpoints smoke — API connectée à postgres CI ──────────────────
  api-smoke:
    name: "API smoke tests — endpoints ML"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.4
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_clean
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5433:5432

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/api-geo

      - name: Apply migrations
        run: |
          pip install psycopg2-binary 2>/dev/null || true
          PGPASSWORD=atlas psql -h localhost -p 5433 -U atlas -d atlas_clean \
            -c "CREATE SCHEMA IF NOT EXISTS atlas;" 2>/dev/null || true
          # Appliquer les migrations SQL
          for f in services/api-geo/migrations/*.sql; do
            echo "Applying $f..."
            PGPASSWORD=atlas psql -h localhost -p 5433 -U atlas -d atlas_clean -f "$f" 2>/dev/null || true
          done

      - name: Build api-geo
        working-directory: services/api-geo
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --release 2>&1

      - name: Start api-geo
        run: |
          DATABASE_URL="postgres://atlas:atlas@localhost:5433/atlas_clean" \
          RUST_LOG=error \
          API_BIND=0.0.0.0:8000 \
          ./services/api-geo/target/release/api-geo &
          sleep 3
          curl -sf http://localhost:8000/healthz || (echo "❌ api-geo ne répond pas"; exit 1)
          echo "✅ api-geo démarré"

      - name: Test /ai/models/status
        run: |
          RESP=$(curl -sf "http://localhost:8000/ai/models/status")
          echo "$RESP" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert 'models' in d, 'Clé models absente'
          assert isinstance(d['models'], list), 'models doit être une liste'
          ids = [m['id'] for m in d['models']]
          expected = ['L1_KED_H', 'L2a_RK', 'L2b_BLUP', 'L3_VFS', 'L4_MTGP']
          for e in expected:
              assert e in ids, f'Modèle {e} absent de /ai/models/status'
          print('✅ /ai/models/status — tous les modèles L1-L4 présents')
          "

      - name: Test /ai/jobs/enqueue (structure)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:8000/ai/jobs/enqueue \
            -H "Content-Type: application/json" \
            -d '{"job_type":"ked_recompute","requested_by":"ci"}')
          # Accepte 200 (OK) ou 401 (non authentifié selon config)
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ] || [ "$STATUS" = "422" ]; then
            echo "✅ /ai/jobs/enqueue répond avec HTTP $STATUS"
          else
            echo "❌ /ai/jobs/enqueue HTTP $STATUS inattendu"
            exit 1
          fi

      - name: Test /ai/3d/asset (structure)
        run: |
          RESP=$(curl -sf "http://localhost:8000/ai/3d/asset?param=vbs&archetype=B" || echo '{"cached":false}')
          echo "$RESP" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert 'cached' in d, 'Clé cached absente de /ai/3d/asset'
          print('✅ /ai/3d/asset — structure correcte')
          "

      - name: Test /thematic/data vbs_ked_h1 (paramètre L1 exposé)
        run: |
          RESP=$(curl -sf "http://localhost:8000/thematic/data?parameter=vbs_ked_h1&include_geometry=false" || echo '{"statistics":{"count":0}}')
          echo "$RESP" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          # En CI la DB est vide — on vérifie juste que la réponse est valide JSON avec statistics
          assert 'statistics' in d, 'Clé statistics absente'
          print(f'✅ /thematic/data vbs_ked_h1 — réponse valide (count={d[\"statistics\"].get(\"count\", 0)} en CI)')
          "

  # ─── 7b. Tests cohérence DB — anti-fallback + consistance MV ────────────────
  db-coherence-tests:
    name: "DB — Cohérence géocodage (anti-fallback)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.4
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_clean
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5433:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup DB + migrations
        run: |
          PGPASSWORD=atlas psql -h localhost -p 5433 -U atlas -d atlas_clean \
            -c "CREATE SCHEMA IF NOT EXISTS atlas; CREATE EXTENSION IF NOT EXISTS postgis;" 2>/dev/null || true
          for f in services/api-geo/migrations/*.sql; do
            PGPASSWORD=atlas psql -h localhost -p 5433 -U atlas -d atlas_clean -f "$f" 2>/dev/null || true
          done

      - name: Test 1 — Aucun sondage avec POINT(1 8.6) sans marquage fallback_default
        run: |
          COUNT=$(PGPASSWORD=atlas psql -h localhost -p 5433 -U atlas -d atlas_clean -t -c "
            SELECT COUNT(*) FROM atlas.sondages
            WHERE geom = ST_SetSRID(ST_MakePoint(1, 8.6), 4326)
              AND location_mode != 'fallback_default'
              AND location_mode IS NOT NULL
              AND deleted_at IS NULL;
          " 2>/dev/null | tr -d ' ' || echo "0")
          echo "Sondages POINT(1 8.6) non marqués : $COUNT"
          if [ "$COUNT" != "0" ] && [ -n "$COUNT" ]; then
            echo "❌ TEST 1 ECHEC : $COUNT sondage(s) avec coordonnée fallback non marqués"
            exit 1
          fi
          echo "✅ Test 1 OK — aucun fallback non marqué"

      - name: Test 2 — Pas de maille avec plus de 50 sondages (seuil géographique)
        run: |
          ROWS=$(PGPASSWORD=atlas psql -h localhost -p 5433 -U atlas -d atlas_clean -t -c "
            SELECT maille_code, COUNT(*) AS nb FROM atlas.sondages
            WHERE deleted_at IS NULL
            GROUP BY maille_code
            HAVING COUNT(*) > 50;
          " 2>/dev/null | grep -c '[A-Z]' || echo "0")
          echo "Mailles avec > 50 sondages : $ROWS"
          if [ "$ROWS" != "0" ]; then
            PGPASSWORD=atlas psql -h localhost -p 5433 -U atlas -d atlas_clean -c "
              SELECT maille_code, COUNT(*) AS nb FROM atlas.sondages
              WHERE deleted_at IS NULL
              GROUP BY maille_code HAVING COUNT(*) > 50 ORDER BY nb DESC;
            " 2>/dev/null || true
            echo "❌ TEST 2 ECHEC : concentration anormale de sondages dans certaines mailles"
            exit 1
          fi
          echo "✅ Test 2 OK — aucune concentration anormale de sondages"

      - name: Test 3 — Cohérence has_data dans mv_mailles_geotech
        run: |
          COUNT=$(PGPASSWORD=atlas psql -h localhost -p 5433 -U atlas -d atlas_clean -t -c "
            SELECT COUNT(*) FROM atlas.mv_mailles_geotech
            WHERE (has_data = true AND n_sondages = 0)
               OR (has_data = false AND n_sondages > 0);
          " 2>/dev/null | tr -d ' ' || echo "0")
          echo "Incohérences has_data/n_sondages : $COUNT"
          if [ "$COUNT" != "0" ] && [ -n "$COUNT" ]; then
            echo "❌ TEST 3 ECHEC : $COUNT incohérence(s) has_data vs n_sondages dans mv_mailles_geotech"
            exit 1
          fi
          echo "✅ Test 3 OK — has_data cohérent avec n_sondages"

      - name: Test 4 — Scripts Python fuzzy sans erreur de syntaxe
        run: |
          python3 -m py_compile scripts/regeocod_fuzzy_v1.py && echo "✅ regeocod_fuzzy_v1.py OK"
          python3 -m py_compile scripts/run_all_models_nightly.py && echo "✅ nightly v1 OK"
          python3 -m py_compile scripts/run_all_models_nightly_v2.py && echo "✅ nightly v2 OK"

  # ─── 7. Docker build api-geo ─────────────────────────────────────────────────
  docker-build:
    name: "Docker — api-geo build"
    runs-on: ubuntu-latest
    # Ne tourne que sur la branche principale ou les PRs (pas sur chaque push feature)
    if: github.ref == 'refs/heads/atlas_v2_clean' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api-geo Docker image
        uses: docker/build-push-action@v5
        with:
          context: services/api-geo
          push: false
          tags: atlas-api-geo:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SQLX_OFFLINE=true
