[package]
name = "api-geo"
version = "0.1.0"
edition = "2021"

[lib]
name = "api_geo"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio", "macros", "tls-rustls", "uuid", "json", "bigdecimal", "time", "chrono"] }
rayon = "1.8"
geo = "0.27"
nalgebra = "0.32"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
time = { version = "0.3", features = ["serde", "formatting"] }
num-traits = "0.2"
csv = "1.3"
encoding_rs = "0.8"
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
calamine = "0.26"
once_cell = "1.19"
statrs = "0.17"
ordered-float = "4.0"
moka = { version = "0.12", features = ["sync"] }
lazy_static = "1.4"
regex = "1.10"

[build-dependencies]
chrono = "0.4"
