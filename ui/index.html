<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas Géotechnique</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Atlas Géotechnique</h1>
      </header>
      <main>
        <div id="map"></div>
        <aside>
          <div class="panel">
            <label>Code Maille</label>
            <input id="grid-code" value="TG-001" />
            <button id="btn-grid">GET /grid/{code}</button>
            <button id="btn-recompute">POST /grid/recompute/{code}</button>
            <button id="btn-shape">GET /grid/{code}/shape</button>
            <button id="btn-export">Export GeoJSON</button>
            <button id="btn-zoom">Zoom Togo</button>
          </div>
          <div class="panel">
            <button id="btn-predict">POST /predict</button>
            <button id="btn-pareto">POST /pareto</button>
          </div>
          <div id="status" class="panel" aria-live="polite"></div>
          <div id="info" class="panel" aria-live="polite"></div>
          <pre id="output" aria-live="polite"></pre>
          <div class="panel" id="legend">
            <strong>Légende</strong><br/>
            <span style="display:inline-block;width:14px;height:14px;background:#ef4444;opacity:.45;border:1px solid #991b1b"></span>
            &nbsp;mailles avec sondages<br/>
            <span style="display:inline-block;width:14px;height:14px;border:1px solid #9ca3af"></span>
            &nbsp;mailles sans sondages
          </div>
        </aside>
      </main>
    </div>
    <script>
      // optional runtime overrides (uncomment to force base URLs without rebuild)
      // window.__API_GEO__ = "http://127.0.0.1:8001";
      // window.__API_INFER__ = "http://127.0.0.1:8002";
      // window.__API_OPTI__ = "http://127.0.0.1:8003";
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
