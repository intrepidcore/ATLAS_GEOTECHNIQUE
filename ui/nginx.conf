server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Pas de cache pour les fichiers HTML et JS (dev/staging)
  location ~* \.(html|js|css)$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files $uri =404;
  }

  # Assets statiques (images, fonts, etc.)
  location ~* \.(ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # ============================================================================
  # Routing MPA (Multi-Page App)
  # ============================================================================

  # PWA Mobile - Routes /colab/mobile/* → mobile.html
  location /colab/mobile {
    add_header Cache-Control "no-store";
    try_files $uri /mobile.html;
  }

  # DB Manager - Route /db-manager.html
  location = /db-manager.html {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # Route par défaut → index.html (Atlas Géotechnique + Colab Studio)
  location / {
    index index.html;
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }

  # ============================================================================
  # Exports 3D statiques (PNG 300dpi + HTML Plotly)
  # Servi depuis exports_3d_v2/ via volume Docker /data/exports
  # ============================================================================

  location /exports/3d/ {
    alias /data/exports/exports_3d_v2/;
    # Volume monté : ./exports_3d_v2 → /data/exports/exports_3d_v2
    autoindex off;
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options "nosniff";
    # Types MIME
    types {
      image/png           png;
      application/pdf     pdf;
      text/html           html;
    }
    default_type application/octet-stream;
  }

  # ============================================================================
  # Proxy API
  # ============================================================================

  location /api/ {
    proxy_pass http://api-geo:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 300s;
    
    # Pas de cache pour l'API
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # Service Worker
  location = /sw.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
  }

  # Manifest PWA
  location = /manifest.webmanifest {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }
}
