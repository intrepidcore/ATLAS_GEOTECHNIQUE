name: atlas

services:
  db:
    image: postgis/postgis:17-3.4
    container_name: atlas-db
    restart: unless-stopped
    env_file:
      - ./.env
      - ./.env.example
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/db:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - atlas-net

  api-geo:
    build: ./services/api-geo
    container_name: atlas-api-geo
    restart: unless-stopped
    env_file:
      - ./.env
      - ./.env.example
    environment:
      DATABASE_URL: postgres://atlas_app_user:${ATLAS_DB_APP_PASSWORD}@db:5432/atlas_clean
      ENABLE_DB_MANAGER: ${ENABLE_DB_MANAGER:-false}
      DATABASE_URL_ADMIN: postgres://atlas_etl_user:${ATLAS_DB_ETL_PASSWORD}@db:5432/atlas_clean
      RUST_LOG: ${RUST_LOG:-info}
      API_BIND: 0.0.0.0:8000
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      EXPORT_DIR: /data/exports
      ATLAS_SCRIPTS_DIR: /opt/atlas/scripts
      # Microservices IA (optionnel) : laisser vide = exécution locale dans api-geo
      ATLAS_API_INFER_URL: ${ATLAS_API_INFER_URL:-}
      ATLAS_API_OPTI_URL: ${ATLAS_API_OPTI_URL:-}
      ATLAS_INTERNAL_SERVICE_TOKEN: ${ATLAS_INTERNAL_SERVICE_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    # Ports exposés pour accès direct (dev/debug)
    ports:
      - "8000:8000"  # Exposé pour accès direct depuis l'UI
    volumes:
      - ./exports:/data/exports
      - ./scripts:/opt/atlas/scripts:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - atlas-net

  api-infer:
    build: ./services/api-infer
    container_name: atlas-api-infer
    restart: unless-stopped
    env_file:
      - ./.env
      - ./.env.example
    environment:
      DATABASE_URL: postgres://atlas_etl_user:${ATLAS_DB_ETL_PASSWORD}@db:5432/atlas_clean
      RUST_LOG: ${RUST_LOG:-info}
      API_INFER_PORT: 8000
      ATLAS_SCRIPTS_DIR: /opt/atlas/scripts
      ATLAS_INTERNAL_SERVICE_TOKEN: ${ATLAS_INTERNAL_SERVICE_TOKEN:-dev-atlas-internal-token}
    volumes:
      - ./scripts:/opt/atlas/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - atlas-net

  api-opti:
    build: ./services/api-opti
    container_name: atlas-api-opti
    restart: unless-stopped
    env_file:
      - ./.env
      - ./.env.example
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      API_OPTI_PORT: 8000
      ATLAS_INTERNAL_SERVICE_TOKEN: ${ATLAS_INTERNAL_SERVICE_TOKEN:-dev-atlas-internal-token}
    ports:
      - "127.0.0.1:8003:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - atlas-net

  ui:
    build:
      context: ./ui
      args:
        - VITE_API_BASE=${VITE_API_BASE:-http://localhost:8000}
        - VITE_API_GEO=${VITE_API_GEO:-/api}
        - VITE_API_INFER=${VITE_API_INFER:-/api-infer}
        - VITE_API_OPTI=${VITE_API_OPTI:-/api-opti}
    container_name: atlas-ui
    env_file:
      - ./.env
      - ./.env.example
    environment:
      - VITE_API_BASE=${VITE_API_BASE:-http://localhost:8000}
      - VITE_API_GEO=${VITE_API_GEO}
      - VITE_API_INFER=${VITE_API_INFER}
      - VITE_API_OPTI=${VITE_API_OPTI}
    depends_on:
      - api-geo
    ports:
      - "8080:80"  # Exposé sur toutes les interfaces pour LAN
    # Volume pour dev: mount dist pour voir les changements sans rebuild
    volumes:
      - ./ui/dist:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - atlas-net

  etl:
    build: ./etl
    container_name: atlas-etl
    env_file:
      - ./.env
      - ./.env.example
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - atlas-net
    # no published ports; run with `docker compose run --rm etl etl ...`
    volumes:
      - ./db/migrations:/migrations:ro
      - ./data:/data:ro

  qgis-worker:
    build: ./qgis_worker
    container_name: atlas-qgis-worker
    restart: unless-stopped
    env_file:
      - ./.env
      - ./.env.example
    environment:
      API_GEO_BASE: http://api-geo:8000
      QGIS_TEMPLATE: /app/templates/atlas_base_skeleton.qpt
      QGIS_LAYOUT: atlas_base_skeleton
      OUTPUT_PDF: /data/exports/test_docker.pdf
      DATABASE_URL: postgres://atlas_readonly_user:${ATLAS_DB_READONLY_PASSWORD}@db:5432/atlas_clean
      QT_QPA_PLATFORM: offscreen
      XDG_RUNTIME_DIR: /tmp/runtime-qgis
    depends_on:
      db:
        condition: service_healthy
      api-geo:
        condition: service_healthy
    volumes:
      - ./qgis_worker/src:/app/src
      - ./qgis_worker/project:/app/project
      - ./QGIS/atlas_base_skeleton.qpt:/app/templates/atlas_base_skeleton.qpt:ro
      - ./exports:/data/exports
    networks:
      - atlas-net

  tileserver:
    image: maptiler/tileserver-gl-light:latest
    container_name: atlas-tileserver
    restart: unless-stopped
    profiles: ["tiles"]
    ports:
      - "8081:8080"
    volumes:
      - ./data/tiles:/data:ro
    environment:
      - MBTILES_FILE=/data/togo_map.mbtiles
    networks:
      - atlas-net

  # ── BLOC E : Pipeline worker auto-amélioration ─────────────────────────────
  # Lance scripts/pipeline_worker.py en mode démon.
  # Écoute atlas.ai_job_queue (polling 30s) et exécute KED/RK/Fusion/VfS
  # automatiquement après chaque import de sondage (trigger trg_enqueue_ai_jobs).
  # Pour démarrer : docker compose up pipeline-worker -d
  # Logs : docker compose logs -f pipeline-worker
  pipeline-worker:
    image: python:3.12-slim
    container_name: atlas-pipeline-worker
    restart: unless-stopped
    working_dir: /opt/atlas
    command: >
      python scripts/pipeline_worker.py
        --database-url postgres://atlas_etl_user:${ATLAS_DB_ETL_PASSWORD}@db:5432/atlas_clean
        --interval 30
    environment:
      DATABASE_URL: postgres://atlas_etl_user:${ATLAS_DB_ETL_PASSWORD}@db:5432/atlas_clean
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      TF_ENABLE_ONEDNN_OPTS: "0"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./scripts:/opt/atlas/scripts:ro
      - ./logs:/opt/atlas/logs
    networks:
      - atlas-net
    profiles: ["pipeline"]

networks:
  atlas-net:
    driver: bridge
