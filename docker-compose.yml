name: atlas

services:
  db:
    image: postgis/postgis:17-3.4
    container_name: atlas-db
    restart: unless-stopped
    env_file:
      - ./.env
      - ./.env.example
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - atlas-net

  api-geo:
    build:
      context: .
      dockerfile: ./services/api-geo/Dockerfile
    container_name: atlas-api-geo
    restart: unless-stopped
    env_file:
      - ./.env
      - ./.env.example
    environment:
      DATABASE_URL: postgres://atlas:atlas@db:5432/atlas_clean
      ATLAS_DESKTOP: "1"
      RUST_LOG: ${RUST_LOG:-info}
      API_BIND: 0.0.0.0:8000
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      EXPORT_DIR: /data/exports
    depends_on:
      db:
        condition: service_healthy
    # Ports exposés pour accès direct (dev/debug)
    ports:
      - "8000:8000"  # Exposé pour accès direct depuis l'UI
    volumes:
      - ./exports:/data/exports
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - atlas-net

  api-infer:
    build: ./services/api-infer
    container_name: atlas-api-infer
    profiles: ["infer"]
    env_file:
      - ./.env
      - ./.env.example
    environment:
      MODEL_PATH: ${MODEL_PATH}
      RUST_LOG: ${RUST_LOG}
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - atlas-net

  api-opti:
    build: ./services/api-opti
    container_name: atlas-api-opti
    profiles: ["opti"]
    env_file:
      - ./.env
      - ./.env.example
    environment:
      RUST_LOG: ${RUST_LOG}
    ports:
      - "127.0.0.1:8003:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - atlas-net

  ui:
    build:
      context: ./ui
      args:
        - VITE_API_BASE=${VITE_API_BASE:-http://localhost:8000}
        - VITE_API_GEO=${VITE_API_GEO:-/api}
        - VITE_API_INFER=${VITE_API_INFER:-/api-infer}
        - VITE_API_OPTI=${VITE_API_OPTI:-/api-opti}
    container_name: atlas-ui
    env_file:
      - ./.env
      - ./.env.example
    environment:
      - VITE_API_BASE=${VITE_API_BASE:-http://localhost:8000}
      - VITE_API_GEO=${VITE_API_GEO}
      - VITE_API_INFER=${VITE_API_INFER}
      - VITE_API_OPTI=${VITE_API_OPTI}
    depends_on:
      - api-geo
    ports:
      - "8080:80"  # Exposé sur toutes les interfaces pour LAN
    # Volume pour dev: mount dist pour voir les changements sans rebuild
    volumes:
      - ./ui/dist:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - atlas-net

  etl:
    build: ./etl
    container_name: atlas-etl
    env_file:
      - ./.env
      - ./.env.example
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - atlas-net
    # no published ports; run with `docker compose run --rm etl etl ...`
    volumes:
      - ./migrations:/migrations:ro
      - ./data:/data:ro

  qgis-worker:
    build: ./qgis_worker
    container_name: atlas-qgis-worker
    restart: unless-stopped
    env_file:
      - ./.env
      - ./.env.example
    environment:
      API_GEO_BASE: http://api-geo:8000
      QGIS_TEMPLATE: /app/templates/atlas_base_skeleton.qpt
      QGIS_LAYOUT: atlas_base_skeleton
      OUTPUT_PDF: /data/exports/test_docker.pdf
      DATABASE_URL: postgres://atlas:atlas@db:5432/atlas_clean
      QT_QPA_PLATFORM: offscreen
      XDG_RUNTIME_DIR: /tmp/runtime-qgis
    depends_on:
      db:
        condition: service_healthy
      api-geo:
        condition: service_healthy
    volumes:
      - ./qgis_worker/src:/app/src
      - ./qgis_worker/project:/app/project
      - ./QGIS/atlas_base_skeleton.qpt:/app/templates/atlas_base_skeleton.qpt:ro
      - ./exports:/data/exports
    networks:
      - atlas-net

  tileserver:
    image: maptiler/tileserver-gl-light:latest
    container_name: atlas-tileserver
    restart: unless-stopped
    profiles: ["tiles"]
    ports:
      - "8081:8080"
    volumes:
      - ./data/tiles:/data:ro
    environment:
      - MBTILES_FILE=/data/togo_map.mbtiles
    networks:
      - atlas-net

networks:
  atlas-net:
    driver: bridge
